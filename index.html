<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joust Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="score-display">Score: 0</div>
      <div id="lives-display">Lives: 1</div>
      <div id="wave-display">Wave: 1</div>
    </div>
    <div id="title-screen" class="screen-overlay">
      <h1>JOUST</h1>
      <p>Press SPACE to Start</p>
      <div class="controls-info">
        <p>Controls:</p>
        <p>← → or A/D: Move</p>
        <p>↑ or W or SPACE: Flap</p>
        <p>P: Pause</p>
      </div>
    </div>
    <div id="pause-screen" class="screen-overlay hidden">
      <h1>PAUSED</h1>
      <p>Press P to Resume</p>
    </div>
    <div id="gameover-screen" class="screen-overlay hidden">
      <h1>GAME OVER</h1>
      <p id="final-score">Score: 0</p>
      <p>Press SPACE to Restart</p>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
